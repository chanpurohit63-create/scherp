version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://erp:erp@db:5432/erp_db
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "3000:5173"

volumes:
  db_data:
